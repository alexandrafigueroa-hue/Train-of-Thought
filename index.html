<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train Animation Test</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* STATION */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* TRAIN */

    .train {
      position: absolute;

      width: 180vw;
      max-width: none;
      height: auto;

      left: 0;
      bottom: -5vh;

      z-index: 10;

      /*
        TEST ANIMATION

        It goes back and forth FOREVER.

        So there is no way for us to
        accidentally miss the animation.
      */

      animation-name: trainTest;
      animation-duration: 8s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }


    @keyframes trainTest {

      from {
        left: -180vw;
      }

      to {
        left: -30vw;
      }

    }

  </style>

</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >

</body>

</html>
