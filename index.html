<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* =========================
       BACKGROUND
       ========================= */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

      pointer-events: none;
    }


    /* =========================
       TRAIN
       ========================= */

    .train {
      position: absolute;

      width: 180vw;
      max-width: none;
      height: auto;

      bottom: -5vh;

      /*
        JavaScript controls LEFT.
      */

      left: -180vw;

      z-index: 10;

      pointer-events: none;
    }

  </style>
</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    id="train"
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >


  <script>

    const train = document.getElementById("train");


    /* =====================================
       TRAIN SETTINGS
       ===================================== */

    const START = -180;
    const END = -32;

    /*
      10 seconds total.
    */

    const DURATION = 10000;


    /* =====================================
       ONE CONTINUOUS DECELERATION

       This equation means:

       fast at beginning
       gradually slower
       slower
       slower
       STOP

       It never reverses.
       It never accelerates again.
       ===================================== */

    function easeOutQuad(t) {

      return 1 - (1 - t) * (1 - t);

    }


    /* =====================================
       MOVE TRAIN
       ===================================== */

    function startTrain() {

      const startTime = performance.now();


      function move(currentTime) {

        const elapsed =
          currentTime - startTime;


        /*
          Turn elapsed time into
          a number from 0 to 1.
        */

        const t =
          Math.min(
            elapsed / DURATION,
            1
          );


        /*
          Smooth continuous slowdown.
        */

        const progress =
          easeOutQuad(t);


        /*
          Calculate exact position.
        */

        const position =
          START +
          (END - START) * progress;


        /*
          Move train.
        */

        train.style.left =
          position + "vw";


        /*
          Continue ONLY until we
          actually reach the end.
        */

        if (t < 1) {

          requestAnimationFrame(move);

        }

        else {

          /*
            Lock it permanently.

            There is no animation left
            after this point.
          */

          train.style.left =
            END + "vw";

        }

      }


      requestAnimationFrame(move);

    }


    /* =====================================
       WAIT FOR TRAIN PNG
       ===================================== */

    if (train.complete) {

      startTrain();

    }

    else {

      train.addEventListener(
        "load",
        startTrain,
        { once: true }
      );

    }

  </script>

</body>

</html>
