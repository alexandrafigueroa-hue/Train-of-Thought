<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train of Thought</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }

    body {
      position: relative;
    }

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: 1;
    }

    .train {
      position: absolute;

      /*
        BIG SCALE:
        We do NOT want the whole train visible.
        Roughly two cars should dominate screen.
      */
      width: 190vw;
      max-width: none;
      height: auto;

      /*
        FINAL STOPPING POSITION
      */
      left: -45vw;
      bottom: -4vh;

      z-index: 3;

      /*
        The animation itself begins offscreen.
      */
      animation:
        arrive 10s
        cubic-bezier(.14, .72, .16, 1)
        forwards;
    }

    @keyframes arrive {

      0% {
        transform: translateX(-120vw);
      }

      50% {
        transform: translateX(-55vw);
      }

      75% {
        transform: translateX(-18vw);
      }

      90% {
        transform: translateX(-3vw);
      }

      96% {
        transform: translateX(0.5vw);
      }

      100% {
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>

  <img
    class="background"
    src="assets/background.png"
    alt=""
  >

  <img
    class="train"
    src="assets/train.png"
    alt="Train of Thought"
  >

</body>

</html>
