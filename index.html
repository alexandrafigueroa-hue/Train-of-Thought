<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* BACKGROUND */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* TRAIN */

    .train {
      position: absolute;

      width: 180vw;
      max-width: none;
      height: auto;

      bottom: -5vh;

      z-index: 10;

      /*
        IMPORTANT:
        This is ALSO the final position.
      */

      left: -32vw;


      /*
        SAME BASIC ANIMATION METHOD
        THAT WE KNOW WORKS.
      */

      animation-name: trainArrival;
      animation-duration: 9.6s;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      animation-fill-mode: backwards;
    }


    @keyframes trainArrival {

      /*
        START
      */

      from {
        left: -180vw;
      }


      /*
        ONE FINAL STOP.

        There are NO keyframes after this.
      */

      to {
        left: -32vw;
      }

    }

  </style>

</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >

</body>

</html>
