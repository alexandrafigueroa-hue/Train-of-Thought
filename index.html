<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* STATION */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* TRAIN */

    .train {
      position: absolute;

      /*
        LARGE TRAIN
        Only a couple of cars should
        dominate the frame.
      */

      width: 180vw;
      max-width: none;
      height: auto;

      /*
        FINAL PARKED POSITION
      */

      left: -32vw;
      bottom: -5vh;

      z-index: 10;

      /*
        ONE CONTINUOUS ARRIVAL
      */

      animation:
        trainArrival
        10s
        cubic-bezier(.12, .72, .16, 1)
        forwards;
    }


    @keyframes trainArrival {

      /*
        Starts completely offscreen
      */

      0% {
        transform: translateX(-150vw);
      }


      /*
        Moving into station
      */

      55% {
        transform: translateX(-55vw);
      }


      /*
        Gradually slowing
      */

      78% {
        transform: translateX(-16vw);
      }


      /*
        Almost at final position
      */

      92% {
        transform: translateX(-3vw);
      }


      /*
        STOP.

        No overshoot.
        No recoil.
        No second push.
      */

      100% {
        transform: translateX(0);
      }

    }

  </style>

</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >

</body>

</html>
