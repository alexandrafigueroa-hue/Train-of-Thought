<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* =========================
       BACKGROUND
       ========================= */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* =========================
       TRAIN
       ========================= */

    .train {
      position: absolute;

      width: 180vw;
      max-width: none;
      height: auto;

      bottom: -5vh;

      z-index: 10;

      /*
        FINAL PARKED POSITION
      */

      left: -32vw;
    }


    /* =========================
       WORKING MOVEMENT
       ========================= */

    .train.moving {
      animation-name: trainMove;
      animation-duration: 10s;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      animation-fill-mode: forwards;
    }


    @keyframes trainMove {

      from {
        left: -180vw;
      }

      to {
        left: -32vw;
      }

    }

  </style>

</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    id="train"
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >


  <script>

    const train = document.getElementById("train");


    /*
      WAIT UNTIL THE TRAIN IMAGE ITSELF
      IS ACTUALLY LOADED.
    */

    function startTrain() {

      /*
        Explicit starting position.
      */

      train.style.left = "-180vw";


      /*
        Force Safari to draw that position
        BEFORE starting the animation.
      */

      void train.offsetWidth;


      /*
        Remove the inline left value so
        the animation can take control.
      */

      train.style.left = "";


      /*
        Start ONE animation.
      */

      train.classList.add("moving");

    }


    /*
      Start only once.
    */

    if (train.complete) {

      requestAnimationFrame(() => {
        requestAnimationFrame(startTrain);
      });

    } else {

      train.addEventListener(
        "load",
        () => {

          requestAnimationFrame(() => {
            requestAnimationFrame(startTrain);
          });

        },
        { once: true }
      );

    }


    /*
      WHEN THE ANIMATION FINISHES:

      1. Lock train at final position.
      2. Remove animation entirely.

      There is therefore NOTHING LEFT
      that can move the train afterward.
    */

    train.addEventListener(
      "animationend",
      () => {

        train.style.animation = "none";
        train.style.left = "-32vw";

      },
      { once: true }
    );

  </script>

</body>

</html>
