<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* BACKGROUND */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* TRAIN */

    .train {
      position: absolute;

      width: 180vw;
      max-width: none;
      height: auto;

      bottom: -5vh;

      z-index: 10;


      /* SAME WORKING ANIMATION */

      animation-name: trainTest;
      animation-duration: 60s;
      animation-timing-function: linear;


      /*
        ONLY CHANGE:

        Play once instead of repeating.
      */

      animation-iteration-count: 1;


      /*
        Keep the train at its final position
        when the animation finishes.
      */

      animation-fill-mode: forwards;
    }


    /* SAME WORKING MOVEMENT */

    @keyframes trainTest {

      /*
        Train begins offscreen.
      */

      0% {
        left: -180vw;
      }


      /*
        Train arrives during the first
        ~10 seconds.
      */

      16% {
        left: -32vw;
      }


      /*
        Train stays EXACTLY here.
      */

      100% {
        left: -32vw;
      }

    }

  </style>

</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >

</body>

</html>
