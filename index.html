<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* ==============================
       BACKGROUND
       ============================== */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* ==============================
       TRAIN
       ============================== */

    .train {
      position: absolute;

      /*
        KEEPING THE LARGE SCALE
      */

      width: 180vw;
      max-width: none;
      height: auto;

      bottom: -5vh;

      z-index: 10;


      /*
        FINAL RESTING POSITION
      */

      left: -32vw;


      /*
        ONE SINGLE ARRIVAL

        ease-out = keeps moving and
        progressively slows all the way
        until the ACTUAL stopping point.
      */

      animation-name: trainArrival;
      animation-duration: 10s;
      animation-timing-function: ease-out;
      animation-iteration-count: 1;
      animation-fill-mode: backwards;
    }


    /* ==============================
       TRAIN MOVEMENT
       ============================== */

    @keyframes trainArrival {

      from {
        left: -180vw;
      }

      to {
        left: -32vw;
      }

    }

  </style>

</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >

</body>

</html>
