<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }

    /* STATION */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }

    /* TRAIN */

    .train {
      position: absolute;

      width: 180vw;
      max-width: none;
      height: auto;

      bottom: -5vh;

      z-index: 10;

      /*
        START POSITION
      */
      left: -180vw;

      /*
        ONE ARRIVAL.
        NO SECOND PUSH.
        NO BOUNCE.
      */
      animation-name: trainArrival;
      animation-duration: 10s;
      animation-timing-function: cubic-bezier(.16, .72, .18, 1);
      animation-iteration-count: 1;
      animation-fill-mode: forwards;
    }

    @keyframes trainArrival {

      from {
        left: -180vw;
      }

      to {
        left: -32vw;
      }

    }

  </style>
</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >

  <img
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >

</body>

</html>
