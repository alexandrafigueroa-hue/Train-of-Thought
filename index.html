<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Train of Thought</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171717;
    }


    /* BACKGROUND */

    .background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

      pointer-events: none;
    }


    /* TRAIN */

    .train {
      position: absolute;

      width: 180vw;
      max-width: none;
      height: auto;

      /*
        This is where the train ends.
        This NEVER changes.
      */

      left: -32vw;
      bottom: -5vh;

      z-index: 10;

      pointer-events: none;

      /*
        Start offscreen using TRANSFORM,
        not left.
      */

      transform: translate3d(-150vw, 0, 0);

      /*
        Ask browser to put train on its
        own composited layer.
      */

      will-change: transform;

      /*
        One smooth movement.
      */

      transition:
        transform
        10s
        cubic-bezier(.20, .75, .25, 1);
    }


    /* FINAL POSITION */

    .train.arrived {
      transform: translate3d(0, 0, 0);
    }

  </style>
</head>


<body>

  <img
    class="background"
    src="./assets/background.png"
    alt=""
  >


  <img
    id="train"
    class="train"
    src="./assets/train.png"
    alt="Train of Thought"
  >


  <script>

    const train =
      document.getElementById("train");


    function startTrain() {

      /*
        Give Safari TWO rendered frames
        with the train offscreen first.

        Then trigger ONE transform.
      */

      requestAnimationFrame(() => {

        requestAnimationFrame(() => {

          train.classList.add("arrived");

        });

      });

    }


    if (train.complete) {

      startTrain();

    } else {

      train.addEventListener(
        "load",
        startTrain,
        { once: true }
      );

    }

  </script>

</body>

</html>
